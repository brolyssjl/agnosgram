name: Tool feedback
description: Report friction using Agnosgram itself (not a bug in your own project's memory).
title: "[feedback] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for friction with **Agnosgram the tool** - a confusing
        command, a missing flag, a doctor message that didn't help. Not for
        questions about your own project's `.agnosgram/` content.

        Prefer capturing friction locally first with `agnosgram feedback
        "<text>"` (writes to `.agnosgram/meta/friction.md`, never sent
        anywhere). Opening this issue is entirely optional and manual - see
        [docs/feedback.md](https://github.com/brolyssjl/agnosgram/blob/main/docs/feedback.md).
  - type: textarea
    id: friction
    attributes:
      label: What friction did you hit?
      description: What were you trying to do, and what happened instead?
      placeholder: |
        Ran `agnosgram doctor` after moving a journal month to archive/ by hand
        and the "source.missing" warning didn't explain that archive/ is checked too.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command(s) involved
      placeholder: "agnosgram doctor --strict"
  - type: input
    id: version
    attributes:
      label: agnosgram --version
      placeholder: "0.10.0"
  - type: textarea
    id: friction-id
    attributes:
      label: Local friction id (optional)
      description: If you ran `agnosgram feedback`, paste the `FRI-NNN` id it printed.
      placeholder: "FRI-003"
