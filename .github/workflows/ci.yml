name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Build (publish config, excludes tests)
        run: npm run build
      - name: Test
        run: npm test
      - name: Token benchmark regression gate
        run: node bench/bench.mjs --check
      - name: Tier-2 end-to-end token eval gate
        run: node bench/tier2.mjs --check

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --check --manifest-path rust/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --manifest-path rust/Cargo.toml -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path rust/Cargo.toml
      - name: cargo build --release
        run: cargo build --release --manifest-path rust/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Build (publish config, excludes tests)
        run: npm run build
      - name: Conformance suite against the Rust binary
        run: AGNOSGRAM_BIN="$PWD/rust/target/release/agnosgram" npm run conformance
