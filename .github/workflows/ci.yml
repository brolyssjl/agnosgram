name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Build (publish config, excludes tests)
        run: npm run build
      - name: Test
        run: npm test
      - name: Token benchmark regression gate
        run: node bench/bench.mjs --check
      - name: Tier-2 end-to-end token eval gate
        run: node bench/tier2.mjs --check
