name: Release

# Fires when a version tag is pushed (e.g. `git tag v0.2.0 && git push --tags`).
# Builds, tests, and creates a GitHub release. npm publish is a separate job that
# only runs once the owner opts in (repo variable NPM_PUBLISH=true + secret NPM_TOKEN).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node bench/bench.mjs --check
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    # Enable by setting repo variable NPM_PUBLISH=true and secret NPM_TOKEN.
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
