name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify tag / rust/Cargo.toml versions agree
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version' rust/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "tag=$tag_version rust/Cargo.toml=$cargo_version"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Version mismatch: tag=v$tag_version rust/Cargo.toml=$cargo_version"
            exit 1
          fi

  # Builds the release binary and runs the full test suite - including the
  # conformance integration tests - against that exact binary, on each
  # platform that ships one (`cargo test --release` builds the release
  # profile and points CARGO_BIN_EXE_agnosgram at it, so the conformance
  # suite exercises the artifact this job then uploads, not a debug build).
  # No continue-on-error: a failing build or failing conformance run on
  # either platform must fail the release.
  build-and-verify:
    needs: [version-guard]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: agnosgram-linux-x64
          - os: macos-latest
            asset: agnosgram-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: cargo test --release (unit + conformance + token benchmark gates, against the shipped binary)
        run: cargo test --release --manifest-path rust/Cargo.toml
      - run: mv rust/target/release/agnosgram "${{ matrix.asset }}"
      - name: Verify the asset was actually produced
        run: test -s "${{ matrix.asset }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: [version-guard, build-and-verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify at least one release asset was produced
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets were produced by build-and-verify"
            exit 1
          fi
      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          gh release create "${{ github.ref_name }}" "${assets[@]}" --generate-notes --verify-tag
